    <!-- Extension Compatibility Shim for window.fetch assignment -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {
          try {
            var protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return protoFetch;
              },
              set: function(val) {
                protoFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (__) {}
        }

        // Suppress external extension errors (frame_ant / Chrome extensions)
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && (
              e.message.indexOf('fetch of #<Window>') !== -1 ||
              e.message.indexOf('Cannot set property fetch') !== -1
            ))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
